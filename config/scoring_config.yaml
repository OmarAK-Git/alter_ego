# S3 governance (2026-07-13): v2.2 @ anomaly_threshold=45 unchanged through S3.1 re-sweep.
# PR-curve best-F1 thr=55 was diagnostic only — not applied. See docs/scoring-config-governance-s3.md.
version: "2.2"
anomaly_threshold: 45.0
# Drift scoring formula (proportional, capped):
#   score_drift = min(contribution_scale_max, drift_accum / drift_threshold * weight)
#
# Operating point (threshold=5, weight=100, max_contrib=50, anomaly_threshold=45):
#   Contribution cap  (50) is reached at drift_accum = 2.5
#   Anomaly threshold (45) is crossed by drift alone at drift_accum ≈ 2.25
#
# This asymmetry is intentional: drift alone can trip the alarm at 2.25 while the
# normalised "full-drift" reference point stays at 5.0.  Do NOT raise weight or
# lower drift_threshold without recalibrating anomaly_threshold.
# WARNING: drift_threshold < 1.0 with weight=100 creates score storms.
drift_threshold: 5.0
max_profile_staleness_days: 14
drift_comparison_history_count: 5
drift_half_life_days: 7
confidence_floor: 0.6
# Observation-count confidence: n / (n + confidence_k). Default k=10.0 (SPEC_V3 §6.5).
confidence_k: 10.0
containment_threshold: 85.0
contribution_scale_max: 50.0
# Max concurrent in-flight LLM explanation jobs (SPEC §8.6). On overflow, template fallback is used immediately.
explainer_queue_depth: 8

laplace_alpha: 1.0
# Deferred S4.6: calendar dual-score not wired; no production reader.
max_calendar_adjustment: 0.3
max_replay_window_days: 30
# S5.6: read by batch/profile_builder/builder.py for supervisor escalation on prolonged build block.
max_profile_build_block_days: 30
recent_drift_window_days: 3
cohort_gate_window_days: 7
# Deferred S4.3: SPEC §11.4 jitter not wired; no production reader.
age_jitter_hours: 4

cohort_gating_constants:
  min_cohort_size: 10
  # Deferred S5.11: prior-update rejection semantics not wired; no production reader.
  min_clean_observation_count: 5
  max_changed_fraction: 0.2
  fleet_drift_enabled: false

# Deferred S4.6: telemetry-gap two-tier not wired; no production reader.
gap_windows:
  gap_correlation_window: 60
  investigation_context_window: 14

features:
  login_hour_rarity:
    weight: 1.0
  geolocation_rarity:
    weight: 2.0
  endpoint_set_rarity:
    weight: 2.0
  process_name_rarity:
    weight: 3.0
  command_line_embedding_similarity:
    weight: 2.0
  drift_alert:
    weight: 100.0
  service_account_execution_frequency_deviation:
    weight: 5.0
  # Shadow-computed volume delta — disabled by default (Phase 2).
  total_volume_delta:
    weight: 1.0
    enabled: false

drift_weights:
  login_hour: 5.0
  geolocation: 5.0
  endpoint_set: 5.0
  process_name: 20.0
  embedding: 40.0
  cadence:
    weight: 0.0
    enabled: false
  total_volume_delta:
    weight: 0.0
    enabled: false
  geo_velocity:
    weight: 0.0
    enabled: false
    vpn_allowlist: []

precision_gate:
  enabled: false
  version: "stage_a_v1"
  family_floor_fraction: 0.1
  containment_min_agreement: 2

staged_drift:
  enabled: false
  soft_crossing_fraction: 0.5
  templates:
    - ["endpoint_set", "process_name", "embedding"]
